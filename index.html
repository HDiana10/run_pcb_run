<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PCB Runner</title>
  <style>
    body { margin: 0; background: #fff; overflow: hidden; }
    canvas { display: block; margin: auto; background: #f4f4f4; border: 2px solid #333; }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="200"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GROUND_Y = 100;

// PCB (player)
let pcb = {
  x: 50,
  y: 100,
  width: 90,
  height: 90,
  velocityY: 1,
  gravity: 1.2  ,
  isJumping: false
};

// Obstacle
let obstacle = {
  x: 800,
  y: 120,
  width: 70,
  height: 70,
  speed: 8
};

let score = 0;
let gameOver = false;
let bgX = 0;

// Images
const pcbImg = new Image();
pcbImg.src = 'pcb.png';

const blockImg = new Image();
blockImg.src = 'block_rezistor.png';

const bgImg = new Image();
bgImg.src = 'background.png';

// Control săritură
document.addEventListener('keydown', (e) => {
  if(pcb.isJumping == false) {
    pcb.velocityY = -20;  // Săritură mai lungă
    pcb.isJumping = true;
  }
});

function resetGame() {
  obstacle.x = 800;
  obstacle.speed = 6;
  score = 0;
  gameOver = false;
  pcb.y = GROUND_Y;
  pcb.velocityY = 0;
  pcb.isJumping = false;
}

function update() {
  if (gameOver) return;

  // Gravitație
  pcb.y += pcb.velocityY;
  pcb.velocityY += pcb.gravity;
  if (pcb.y >= GROUND_Y) {
    pcb.y = GROUND_Y;
    pcb.velocityY = 0;
    pcb.isJumping = false;
  }

  // Fundal scroll
  bgX -= 2;
  if (bgX <= -800) bgX = 0;

  // Obstacol
  obstacle.x -= obstacle.speed;
  if (obstacle.x + obstacle.width < 0) {
    obstacle.x = 800 + Math.random() * 200;
    score++;

    // Crește viteza treptat
    if (obstacle.speed < 16) {
      obstacle.speed += 0.5;
    }
  }

  // Coliziune
  if (
    pcb.x < obstacle.x + obstacle.width &&
    pcb.x + pcb.width > obstacle.x &&
    pcb.y < obstacle.y + obstacle.height &&
    pcb.y + pcb.height > obstacle.y
  ) {
    gameOver = true;
    setTimeout(resetGame, 2000);
  }
}

pcbImg.onload = function() {
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fundal
    ctx.drawImage(bgImg, bgX, 0, 800, 200);
    ctx.drawImage(bgImg, bgX + 800, 0, 800, 200);

    // PCB player
    ctx.drawImage(pcbImg, pcb.x, pcb.y, pcb.width, pcb.height);

    // Obstacol
    ctx.drawImage(blockImg, obstacle.x, obstacle.y, obstacle.width, obstacle.height);

    // Scor sus dreapta
    ctx.fillStyle = "#000";
    ctx.font = "22px Arial";
    ctx.textAlign = "right";
    ctx.fillText("Score: " + score, canvas.width - 20, 30);

    // Game Over
    if (gameOver) {
      ctx.fillStyle = "red";
      ctx.font = "40px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Game Over", canvas.width / 2, 100);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
};
</script>
</body>
</html>

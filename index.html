<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PCB Runner</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      border: 2px solid #333;
      width: 100%;
      max-width: 960px;
      height: auto;
      background: #f4f4f4;
      display: block;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Setăm dimensiuni fixe în cod pentru logică corectă
canvas.width = 960;
canvas.height = 200;

const GROUND_Y = 110;

// PCB (player)
let pcb = {
  x: 50,
  y: GROUND_Y,
  width: 70,
  height: 70,
  velocityY: 0,
  gravity: 0.8,
  isJumping: false
};

// Obstacle
let obstacle = {
  x: canvas.width,
  y: GROUND_Y + 20,
  width: 50,
  height: 50,
  speed: 2
};

let score = 0;
let gameOver = false;
let hasReset = false;
let bgX = 0;

// Images
const pcbImg = new Image();
pcbImg.src = 'pcb.png';

const blockImg = new Image();
blockImg.src = 'block_rezistor.png';

const bgImg = new Image();
bgImg.src = 'background.png';

// Săritură
document.addEventListener('keydown', (e) => {
  if (!pcb.isJumping && !gameOver) {
    pcb.velocityY = -16;
    pcb.isJumping = true;
  }
});

function resetGame() {
  obstacle.x = canvas.width;
  obstacle.speed = 5;
  score = 0;
  gameOver = false;
  pcb.y = GROUND_Y;
  pcb.velocityY = 0;
  pcb.isJumping = false;
}

function update() {
  if (gameOver) return;

  // Gravitație
  pcb.y += pcb.velocityY;
  pcb.velocityY += pcb.gravity;
  if (pcb.y >= GROUND_Y) {
    pcb.y = GROUND_Y;
    pcb.velocityY = 0;
    pcb.isJumping = false;
  }

  // Fundal scroll
  bgX -= 2;
  if (bgX <= -canvas.width) bgX = 0;

  // Obstacol
  obstacle.x -= obstacle.speed;
  if (obstacle.x + obstacle.width < 0) {
    obstacle.x = canvas.width + Math.random() * 200;
    score++;

    if (obstacle.speed < 14) {
      obstacle.speed += 0.4;
    }
  }

  // Coliziune
  if (
    pcb.x < obstacle.x + obstacle.width &&
    pcb.x + pcb.width > obstacle.x &&
    pcb.y < obstacle.y + obstacle.height &&
    pcb.y + pcb.height > obstacle.y &&
    !hasReset
  ) {
    gameOver = true;
    hasReset = true;
    setTimeout(() => {
      resetGame();
      hasReset = false;
    }, 1500);
  }
}

pcbImg.onload = function() {
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fundal
    ctx.drawImage(bgImg, bgX, 0, canvas.width, canvas.height);
    ctx.drawImage(bgImg, bgX + canvas.width, 0, canvas.width, canvas.height);

    // PCB
    ctx.drawImage(pcbImg, pcb.x, pcb.y, pcb.width, pcb.height);

    // Obstacol
    ctx.drawImage(blockImg, obstacle.x, obstacle.y, obstacle.width, obstacle.height);

    // Scor
    ctx.fillStyle = "#000";
    ctx.font = "22px Arial";
    ctx.textAlign = "right";
    ctx.fillText("Score: " + score, canvas.width - 20, 30);

    if (gameOver) {
      ctx.fillStyle = "#003366";
      ctx.font = "40px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Game Over", canvas.width / 2, 100);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
};
</script>
</body>
</html>
